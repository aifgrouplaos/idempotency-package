name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Publish @bounkhong packages
        run: |
          pnpm --filter @bounkhong/idempotency-core publish --access public --no-git-checks --provenance
          pnpm --filter @bounkhong/idempotency-adapter-memory publish --access public --no-git-checks --provenance
          pnpm --filter @bounkhong/idempotency-adapter-sql publish --access public --no-git-checks --provenance
          pnpm --filter @bounkhong/idempotency-adapter-redis publish --access public --no-git-checks --provenance
          pnpm --filter @bounkhong/idempotency-nestjs publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
